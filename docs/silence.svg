<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<rect width="1000" height="300" fill="#0d1117"/>
